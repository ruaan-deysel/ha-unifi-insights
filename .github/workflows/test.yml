---
name: Test & Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run tests & coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libturbojpeg

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14.2

      - name: Install dependencies
        run: |
          uv venv --python 3.14.2
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          uv pip install . ".[dev]" homeassistant

      - name: Run tests and generate coverage report
        run: |
          pytest --cov --cov-branch --cov-report=xml

      - name: Check per-file coverage
        run: |
          python script/check_coverage_per_file.py coverage.xml --fail-under 95

      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          files: ./coverage.xml

  frontend:
    name: Frontend lint, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test with coverage
        run: npm test -- --coverage

      - name: Build bundle
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser regression tests
        run: npm run test:browser

      - name: Upload browser test traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          path: frontend/test-results/
          retention-days: 7

      - name: Bundle size budget
        run: npm run size

      - name: Committed bundle matches source
        run: git diff --exit-code -- ../custom_components/unifi_insights/frontend/
