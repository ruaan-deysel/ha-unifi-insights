---
# Codecov configuration
# Reference: https://docs.codecov.com/docs/codecov-yaml

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        target: 95%
        threshold: 0.5%
    patch:
      default:
        target: 90%
        threshold: 0.5%

comment:
  layout: "reach, diff, flags, files, footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

ignore:
  - "tests/**/*"
  - "script/**/*"
